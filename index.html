<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LANKATILES Room Visualizer</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
    }

    #visualizer-wrapper {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }

    #visualizer-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    #session-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    #session-box {
      width: 100%;
      max-width: 460px;
      padding: 34px 30px;
      box-sizing: border-box;
      text-align: center;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.30);
    }

    #session-box h2 {
      margin: 0 0 12px;
      font-size: 25px;
      line-height: 1.25;
      color: #222222;
    }

    #session-box p {
      margin: 0 0 18px;
      font-size: 15px;
      line-height: 1.55;
      color: #555555;
    }

    #countdown {
      margin: 18px 0 24px;
      font-size: 50px;
      line-height: 1;
      font-weight: 700;
      color: #d71920;
    }

    #countdown-label {
      display: block;
      margin-top: 9px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #777777;
    }

    .button {
      width: 100%;
      padding: 14px 18px;
      border-radius: 7px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-sizing: border-box;
    }

    #continue-btn {
      border: 0;
      background: #d71920;
      color: #ffffff;
    }

    #continue-btn:hover {
      opacity: 0.90;
    }

    #end-btn {
      margin-top: 12px;
      border: 1px solid #cccccc;
      background: #ffffff;
      color: #555555;
    }

    #note {
      margin: 18px 0 0 !important;
      font-size: 12px !important;
      color: #888888 !important;
    }

    @media (max-width: 600px) {
      #session-box {
        max-width: 360px;
        padding: 28px 22px;
      }

      #session-box h2 {
        font-size: 22px;
      }

      #countdown {
        font-size: 44px;
      }
    }
  </style>
</head>

<body>

  <div id="visualizer-wrapper">
    <iframe
      id="visualizer-frame"
      src="https://tilesview.ai/app/yAppfsmGg4SZB4PNAIATBA/visualizer/1182?share-product=1008146"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>

  <div id="session-overlay">
    <div id="session-box">
      <h2>Are you still using the Visualizer?</h2>

      <p>
        Your session is about to end.
        Select <strong>Continue Session</strong> to keep using the
        LANKATILES Room Visualizer.
      </p>

      <div id="countdown">
        <span id="countdown-number">30</span>
        <span id="countdown-label">seconds remaining</span>
      </div>

      <button id="continue-btn" class="button" type="button">
        Continue Session
      </button>

      <button id="end-btn" class="button" type="button">
        End Session
      </button>

      <p id="note">
        If no action is taken, you will be returned to the showroom selection page.
      </p>
    </div>
  </div>

  <script>
    (function () {
      const SESSION_LENGTH_MS = 1 * 60 * 1000;
      const WARNING_LENGTH_MS = 30 * 1000;
      const TALLY_URL = "https://tally.so/r/aQLXev";

      const overlay = document.getElementById("session-overlay");
      const countdownNumber = document.getElementById("countdown-number");
      const continueButton = document.getElementById("continue-btn");
      const endButton = document.getElementById("end-btn");

      let warningTimer = null;
      let sessionTimer = null;
      let countdownTimer = null;

      function clearTimers() {
        clearTimeout(warningTimer);
        clearTimeout(sessionTimer);
        clearInterval(countdownTimer);
      }

      function hideWarning() {
        overlay.style.display = "none";
        countdownNumber.textContent = "30";
      }

      function startSession() {
        clearTimers();
        hideWarning();

        warningTimer = setTimeout(
          showWarning,
          SESSION_LENGTH_MS - WARNING_LENGTH_MS
        );

        sessionTimer = setTimeout(
          endSession,
          SESSION_LENGTH_MS
        );
      }

      function showWarning() {
        overlay.style.display = "flex";

        let secondsLeft = 30;
        countdownNumber.textContent = secondsLeft;

        countdownTimer = setInterval(function () {
          secondsLeft -= 1;

          if (secondsLeft >= 0) {
            countdownNumber.textContent = secondsLeft;
          }

          if (secondsLeft <= 0) {
            clearInterval(countdownTimer);
          }
        }, 1000);
      }

      function endSession() {
        clearTimers();
        window.location.replace(TALLY_URL);
      }

      continueButton.addEventListener("click", function () {
        startSession();
      });

      endButton.addEventListener("click", function () {
        endSession();
      });

      startSession();
    })();
  </script>

</body>
</html>
